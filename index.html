<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="bmi-container">
      <h1>BMI Calculator</h1>

      <p>Calculate your Body Mass Index</p>

      <div class="input-group">
        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" placeholder="Enter your weight" />
      </div>

      <div class="input-group">
        <label for="height">Height (cm)</label>
        <input type="number" id="height" placeholder="Enter your height" />
      </div>

      <button onclick="calculateBMI()">Calculate BMI</button>

      <div class="error" id="error"></div>

      <div class="result" id="result">
        <h2>Your BMI</h2>

        <div class="bmi-value" id="bmiValue"></div>

        <div class="category" id="category"></div>
      </div>

      <div class="bmi-info">
        <h3>BMI Categories</h3>

        <div>
          <span>Underweight</span>
          <span>Below 18.5</span>
        </div>

        <div>
          <span>Normal</span>
          <span>18.5 - 24.9</span>
        </div>

        <div>
          <span>Overweight</span>
          <span>25 - 29.9</span>
        </div>

        <div>
          <span>Obese</span>
          <span>30+</span>
        </div>
      </div>
    </div>

    <script>
      function calculateBMI() {
        // Get input values
        let weight = parseFloat(document.getElementById("weight").value);
        let height = parseFloat(document.getElementById("height").value);

        let error = document.getElementById("error");
        let result = document.getElementById("result");
        let bmiValue = document.getElementById("bmiValue");
        let category = document.getElementById("category");

        // Clear previous messages
        error.innerHTML = "";
        result.style.display = "none";

        // Validation
        if (isNaN(weight) || isNaN(height)) {
          error.innerHTML = "Please enter both weight and height.";
          return;
        }

        if (weight <= 0 || height <= 0) {
          error.innerHTML = "Please enter valid positive values.";
          return;
        }

        // Convert height from cm to meters
        let heightInMeters = height / 100;

        // BMI formula
        let bmi = weight / (heightInMeters * heightInMeters);

        // Display BMI
        bmiValue.innerHTML = bmi.toFixed(2);

        // Determine BMI category
        if (bmi < 18.5) {
          category.innerHTML = "Underweight";
        } else if (bmi >= 18.5 && bmi < 25) {
          category.innerHTML = "Normal Weight";
        } else if (bmi >= 25 && bmi < 30) {
          category.innerHTML = "Overweight";
        } else {
          category.innerHTML = "Obese";
        }

        // Show result
        result.style.display = "block";
      }
    </script>
  </body>
</html>
